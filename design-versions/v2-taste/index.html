<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ulamove • Gesundheit & Wohlbefinden</title>
    <meta name="description" content="Physiotherapie, Atemtherapie und therapeutisches Yoga in Köln-Mülheim und Köln-Sülz.">
    <link rel="icon" type="image/png" href="../../images/ulamove_logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- No build step on this site, so Google Fonts is linked rather than self-hosted.
         Self-hosting via @font-face would be the faster option if a build is ever added. -->
    <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@400..800&family=Wix+Madefor+Text:wght@400..600&display=swap" rel="stylesheet">
<style>
/* =============================================================================
   ulamove — Version 2

   Aesthetic family: clinical editorial. Not an official design system, and not
   glassmorphism or Apple Liquid Glass. Native CSS with semantic tokens, because
   the site is static with no bundler.

   Palette family: Forest (deep green + cool bone + one amber accent).
   Deliberately NOT the warm-cream-plus-brass palette every wellness page uses.

   Radius scale: 0. Sharp everywhere, buttons included.
   Accent: amber, locked. Never used as small text, so contrast holds in both
   themes. The only multi-colour element on the page is the 3px brand bar at the
   very top, built from the six strokes of the painted logo. Exactly one instance.
   ============================================================================= */

:root {
    color-scheme: light dark;

    --bg:        #EDEFEA;
    --bg-2:      #E3E7E0;
    --fg:        #101A16;
    --fg-muted:  #56635C;
    --rule:      rgba(16, 26, 22, 0.15);
    --rule-firm: rgba(16, 26, 22, 0.32);
    --accent:    #D99A2B;
    --on-accent: #101A16;

    --ease: cubic-bezier(0.16, 1, 0.3, 1);

    --gutter: clamp(20px, 4.4vw, 68px);
    --shell:  1320px;
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg:        #0D1613;
        --bg-2:      #121F1A;
        --fg:        #E8EDE6;
        --fg-muted:  #93A39A;
        --rule:      rgba(232, 237, 230, 0.17);
        --rule-firm: rgba(232, 237, 230, 0.36);
        --accent:    #E0A63C;
        --on-accent: #0D1613;
    }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

@media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
}

body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Wix Madefor Text', system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.62;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
}

img { display: block; max-width: 100%; }

a { color: inherit; }

::selection { background: var(--accent); color: var(--on-accent); }

:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

.shell {
    max-width: var(--shell);
    margin: 0 auto;
    padding-inline: var(--gutter);
}

.display {
    font-family: 'Wix Madefor Display', system-ui, sans-serif;
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.02;
}

/* The one multi-colour element. Six strokes of the painted logo, once. */
.brandbar {
    height: 3px;
    background: linear-gradient(90deg,
        #E9008A 0%, #E9008A 16%,
        #F57A00 16%, #F57A00 33%,
        #FBD200 33%, #FBD200 50%,
        #00A94F 50%, #00A94F 66%,
        #00B7E4 66%, #00B7E4 83%,
        #0047BB 83%, #0047BB 100%);
}

/* =============================================================================
   Nav — one line at desktop, 68px tall
   ============================================================================= */

.nav {
    position: sticky;
    top: 0;
    z-index: 50;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid transparent;
    transition: border-color 240ms ease;
}

.nav[data-stuck="true"] { border-bottom-color: var(--rule); }

.nav-inner {
    max-width: var(--shell);
    margin: 0 auto;
    padding: 0 var(--gutter);
    height: 68px;
    display: flex;
    align-items: center;
    gap: 20px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    margin-right: auto;
}

.brand img { width: 28px; height: 28px; }

.brand span {
    font-family: 'Wix Madefor Display', system-ui, sans-serif;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: -0.02em;
}

.langs { display: flex; gap: 2px; }

.lang-btn {
    appearance: none;
    border: 0;
    background: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--fg-muted);
    padding: 8px 9px;
    border-bottom: 2px solid transparent;
    transition: color 180ms ease, border-color 180ms ease, transform 120ms var(--ease);
}

.lang-btn[aria-pressed="true"] {
    color: var(--fg);
    border-bottom-color: var(--accent);
}

.lang-btn:active { transform: translateY(1px); }

@media (hover: hover) {
    .lang-btn:hover { color: var(--fg); }
}

/* =============================================================================
   Hero — asymmetric split, fits the first viewport
   ============================================================================= */

.hero {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 0.86fr);
    align-items: stretch;
    min-height: min(100dvh, 860px);
    border-bottom: 1px solid var(--rule);
}

.hero-copy {
    padding: clamp(40px, 6vw, 88px) clamp(28px, 5vw, 72px) clamp(40px, 5vw, 72px) var(--gutter);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 26px;
    max-width: 820px;
    margin-left: auto;
    width: 100%;
}

.hero-place {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--fg-muted);
    display: flex;
    align-items: center;
    gap: 14px;
}

.hero-place::before {
    content: "";
    width: 30px;
    height: 2px;
    background: var(--accent);
    flex: none;
}

.hero h1 {
    font-size: clamp(48px, 6.6vw, 92px);
    max-width: 15ch;
    text-wrap: balance;
}

.hero-sub {
    font-size: clamp(19px, 1.55vw, 23px);
    line-height: 1.4;
    color: var(--fg-muted);
    max-width: 30ch;
}

.hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 6px;
}

.hero-media {
    position: relative;
    overflow: hidden;
    background: var(--bg-2);
    border-left: 1px solid var(--rule);
}

.hero-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 52% 38%;
}

/* =============================================================================
   Buttons — radius 0, amber fill carries dark ink
   ============================================================================= */

.btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 15px 24px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.005em;
    text-decoration: none;
    white-space: nowrap;
    border: 1px solid transparent;
    transition: transform 140ms var(--ease), background-color 200ms ease, color 200ms ease, border-color 200ms ease;
}

.btn:active { transform: translateY(1px); }

.btn::after {
    content: "\2192";
    font-size: 15px;
    transition: transform 260ms var(--ease);
}

.btn--solid {
    background: var(--accent);
    color: var(--on-accent);
}

.btn--line {
    border-color: var(--rule-firm);
    color: var(--fg);
}

@media (hover: hover) {
    .btn:hover::after { transform: translateX(4px); }
    .btn--solid:hover { background: var(--fg); color: var(--bg); }
    .btn--line:hover { border-color: var(--fg); background: var(--fg); color: var(--bg); }
}

/* =============================================================================
   Section index — a sticky strip, not a tab card. Both offerings stay on the
   page and stay indexable; this only jumps to them and marks where you are.
   ============================================================================= */

.index {
    position: sticky;
    top: 68px;
    z-index: 40;
    background: var(--bg-2);
    border-bottom: 1px solid var(--rule);
}

.index-inner {
    max-width: var(--shell);
    margin: 0 auto;
    padding-inline: var(--gutter);
    display: grid;
    grid-template-columns: 1fr 1fr;
}

.index-link {
    padding: 17px 0;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--fg-muted);
    text-decoration: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 200ms ease, border-color 240ms ease;
}

.index-link + .index-link { padding-left: 28px; }

.index-link[aria-current="true"] {
    color: var(--fg);
    border-bottom-color: var(--accent);
}

@media (hover: hover) {
    .index-link:hover { color: var(--fg); }
}

/* =============================================================================
   Section chrome
   ============================================================================= */

section[id] { scroll-margin-top: 128px; }

.band { padding-block: clamp(64px, 9vw, 132px); }

/* Wide enough that the Russian headings do not fragment into four short lines
   with a stranded "&". German and English sit at two to three lines. */
.band-head {
    max-width: 44ch;
    margin-bottom: clamp(40px, 5vw, 72px);
}

.band-head h2 {
    font-family: 'Wix Madefor Display', system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(32px, 4.2vw, 58px);
    line-height: 1.04;
    letter-spacing: -0.028em;
    text-wrap: balance;
}

/* --- Physiotherapie: left gutter numerals, grouped hairlines, brand mark --- */

.indications {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: clamp(32px, 4vw, 64px);
    border-top: 1px solid var(--rule-firm);
}

/* A short amber rule anchors each indication group. No numerals: two items are
   countable without being counted for the reader. */
.item { padding-top: 26px; }

.item::before {
    content: "";
    display: block;
    width: 44px;
    height: 3px;
    background: var(--accent);
    margin-bottom: 22px;
}

.item h3 {
    font-family: 'Wix Madefor Display', system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(21px, 2.1vw, 27px);
    line-height: 1.14;
    letter-spacing: -0.02em;
    margin-bottom: 14px;
    text-wrap: balance;
}

.item p {
    color: var(--fg-muted);
    font-size: 16px;
    line-height: 1.6;
}

.multiline { white-space: pre-line; }

.physio-foot {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 28px;
    align-items: center;
    margin-top: clamp(40px, 5vw, 64px);
    padding-top: 28px;
    border-top: 1px solid var(--rule);
}

.notice {
    font-size: 15px;
    line-height: 1.5;
    color: var(--fg);
    padding-left: 18px;
    border-left: 3px solid var(--accent);
    max-width: 48ch;
}

/* The painted logo, used large as the section's own visual. It is a real brand
   asset, so it does the job a stock texture would otherwise fake. Blended into
   the ground rather than laid on top, so it reads as a wash, not a sticker. */
.mark {
    position: absolute;
    right: -5%;
    top: -7%;
    width: clamp(230px, 31vw, 500px);
    opacity: 0.26;
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: 0;
}

@media (prefers-color-scheme: dark) {
    .mark { opacity: 0.22; mix-blend-mode: screen; }
}

.band--physio { position: relative; overflow: hidden; }
.band--physio > .shell { position: relative; z-index: 1; }

/* --- Training: full-bleed band, offset copy. A different layout family. ---

   The band keeps the same deep forest in both themes, so the page never flips
   into the opposite mode mid-scroll. On the light theme it reads as one
   deliberate dark chapter; on the dark theme it reads as a lifted panel. */

.band--training {
    background: #14231E;
    color: #E8EDE6;
    border-block: 1px solid rgba(232, 237, 230, 0.1);
}

.band--training .band-head h2,
.band--training .train-lede { color: #E8EDE6; }

.train-bleed {
    position: relative;
    aspect-ratio: 12 / 5;
    overflow: hidden;
    background: #0A0F0D;
}

.train-bleed img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 38%;
}

.train-grid {
    display: grid;
    grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
    gap: clamp(32px, 5vw, 80px);
    align-items: start;
    padding-top: clamp(40px, 5vw, 68px);
}

.train-titles {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.train-titles h3 {
    font-family: 'Wix Madefor Display', system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(27px, 3.4vw, 46px);
    line-height: 1.04;
    letter-spacing: -0.028em;
    text-wrap: balance;
}

.train-titles h3 + h3 { color: var(--accent); }

.train-lede {
    font-size: clamp(17px, 1.35vw, 20px);
    line-height: 1.58;
    opacity: 0.82;
    max-width: 62ch;
}

.train-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 30px;
}

.band--training .btn--line {
    border-color: rgba(232, 237, 230, 0.42);
    color: #E8EDE6;
}

@media (hover: hover) {
    .band--training .btn--line:hover {
        background: #E8EDE6;
        color: #14231E;
        border-color: #E8EDE6;
    }
    .band--training .btn--solid:hover {
        background: #E8EDE6;
        color: #14231E;
    }
}

/* --- Practice: two addresses side by side, a third layout family --- */

.practice-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: clamp(28px, 3.5vw, 56px);
    border-top: 1px solid var(--rule-firm);
    padding-top: 34px;
}

.card-label {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin-bottom: 16px;
}

.addr {
    font-family: 'Wix Madefor Display', system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(19px, 1.8vw, 24px);
    line-height: 1.22;
    letter-spacing: -0.018em;
    text-decoration: none;
    display: block;
}

.addr small {
    display: block;
    font-family: 'Wix Madefor Text', system-ui, sans-serif;
    font-size: 14.5px;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--fg-muted);
    margin-top: 7px;
}

.addr, .plainlink {
    background-image: linear-gradient(var(--accent), var(--accent));
    background-size: 0 2px;
    background-position: 0 100%;
    background-repeat: no-repeat;
    transition: background-size 320ms var(--ease);
}

@media (hover: hover) {
    .addr:hover, .plainlink:hover { background-size: 100% 2px; }
}

.plainlink {
    display: inline-block;
    text-decoration: none;
    font-size: 17px;
    padding-bottom: 2px;
}

.contact-stack { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }

/* =============================================================================
   Footer
   ============================================================================= */

footer {
    border-top: 1px solid var(--rule-firm);
    padding-block: 44px 30px;
}

.footer-grid {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 24px 44px;
}

.footer-legal {
    display: flex;
    gap: 22px;
    margin-right: auto;
}

.footer-legal a {
    font-size: 14px;
    color: var(--fg-muted);
    text-decoration: none;
    transition: color 180ms ease;
}

@media (hover: hover) {
    .footer-legal a:hover { color: var(--fg); }
}

.social-icons { display: flex; gap: 6px; }

/* Brand marks kept from the existing site. These are the Simple Icons paths for
   each network, not icons drawn by hand for this page. */
.social-icon {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border: 1px solid var(--rule);
    color: var(--fg);
    text-decoration: none;
    transition: transform 150ms var(--ease), background-color 200ms ease, color 200ms ease, border-color 200ms ease;
}

.social-icon svg { width: 17px; height: 17px; }
.social-icon:active { transform: translateY(1px); }

@media (hover: hover) {
    .social-icon:hover { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .social-icon.instagram:hover path { fill: url(#instagram-gradient); }
}

.social-icon.instagram path { fill: currentColor; }

.copyright {
    width: 100%;
    padding-top: 26px;
    margin-top: 8px;
    border-top: 1px solid var(--rule);
    font-size: 12.5px;
    color: var(--fg-muted);
}

/* =============================================================================
   Motion — reveal on enter. Communicates reading order, nothing more.
   ============================================================================= */

[data-reveal] {
    opacity: 0;
    transform: translateY(18px);
}

[data-reveal][data-shown] {
    opacity: 1;
    transform: none;
    transition:
        opacity 620ms var(--ease) calc(var(--i, 0) * 70ms),
        transform 620ms var(--ease) calc(var(--i, 0) * 70ms);
}

/* No JS, no observer, no problem: content is visible. */
.no-js [data-reveal] { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
    [data-reveal] { opacity: 1; transform: none; }
    [data-reveal][data-shown] { transition: none; }
    .btn:active, .lang-btn:active, .social-icon:active { transform: none; }
    .btn:hover::after { transform: none; }
    .addr, .plainlink { transition: none; }
}

/* =============================================================================
   Responsive
   ============================================================================= */

@media (max-width: 1000px) {
    .hero {
        grid-template-columns: 1fr;
        min-height: 0;
    }
    .hero-copy {
        padding: 56px var(--gutter) 44px;
        max-width: none;
        margin-left: 0;
    }
    /* The source photo is close to square, so a wide crop on a narrow screen
       loses the person being treated. 4:3 keeps both faces in frame. */
    .hero-media {
        border-left: 0;
        border-top: 1px solid var(--rule);
        aspect-ratio: 4 / 3;
    }
    .hero-media img { object-position: 50% 42%; }
    .hero h1 { max-width: 20ch; }
    .train-grid { grid-template-columns: 1fr; }
}

@media (max-width: 760px) {
    body { font-size: 16px; }

    .indications { grid-template-columns: 1fr; gap: 0; }
    .item + .item { border-top: 1px solid var(--rule); margin-top: 30px; }

    .physio-foot { grid-template-columns: 1fr; align-items: start; }
    .practice-grid { padding-top: 26px; }

    .index-inner { grid-template-columns: 1fr; }
    .index-link {
        padding: 13px 0;
        border-bottom: 0;
        border-left: 2px solid transparent;
        padding-left: 14px;
    }
    .index-link + .index-link { padding-left: 14px; border-top: 1px solid var(--rule); }
    .index-link[aria-current="true"] {
        border-bottom-color: transparent;
        border-left-color: var(--accent);
    }

    .train-bleed { aspect-ratio: 4 / 3; }
    .hero-actions .btn, .train-actions .btn { flex: 1 1 100%; justify-content: space-between; }
    .footer-legal { width: 100%; }
}
</style>
</head>
<body class="no-js">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
        <linearGradient id="instagram-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f09433"/>
            <stop offset="25%" stop-color="#e6683c"/>
            <stop offset="50%" stop-color="#dc2743"/>
            <stop offset="75%" stop-color="#cc2366"/>
            <stop offset="100%" stop-color="#bc1888"/>
        </linearGradient>
    </defs>
</svg>

<div class="brandbar" aria-hidden="true"></div>
<span id="top-sentinel" aria-hidden="true"></span>

<header class="nav" id="nav">
    <div class="nav-inner">
        <a class="brand" href="#top" aria-label="ulamove">
            <img src="../../images/ulamove_logo.png" alt="" width="28" height="28">
            <span>ulamove</span>
        </a>
        <nav class="langs" aria-label="Sprache / Language">
            <button class="lang-btn" data-lang="de" aria-pressed="true">DE</button>
            <button class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
            <button class="lang-btn" data-lang="ru" aria-pressed="false">RU</button>
        </nav>
    </div>
</header>

<main id="top">

    <section class="hero">
        <div class="hero-copy">
            <p class="hero-place" data-i18n="location" data-reveal></p>
            <h1 class="display" data-i18n="title" data-reveal style="--i:1"></h1>
            <p class="hero-sub" data-i18n="tagline" data-reveal style="--i:2"></p>
            <div class="hero-actions" data-reveal style="--i:3">
                <!-- <a class="btn btn--solid" href="https://cal.com/ulamove/privattermin-physiotherapie" target="_blank" rel="noopener" data-i18n="physio-cta1"></a> -->
                <a class="btn btn--solid" href="https://cal.com/ulamove/privattermin-physiotherapie-copy" target="_blank" rel="noopener">
                    <span data-i18n="physio-cta2"></span>
                </a>
            </div>
        </div>
        <div class="hero-media">
            <img src="../../images/ulamove-physio.jpg" alt="Physiotherapie" width="725" height="745" fetchpriority="high">
        </div>
    </section>

    <div class="index">
        <div class="index-inner">
            <a class="index-link" href="#physio" data-index-for="physio" data-i18n="physio-btn"></a>
            <a class="index-link" href="#training" data-index-for="training" data-i18n="training-btn"></a>
        </div>
    </div>

    <!-- Physiotherapie ------------------------------------------------------ -->
    <section class="band band--physio" id="physio" aria-labelledby="physio-heading">
        <img class="mark" src="../../images/ulamove_logo.png" alt="" aria-hidden="true" loading="lazy">
        <div class="shell">
            <div class="band-head" data-reveal>
                <h2 id="physio-heading" data-i18n="physio-btn"></h2>

<script>
(function () {
    'use strict';

    document.body.classList.remove('no-js');

    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* -----------------------------------------------------------------
       Reveal on enter. IntersectionObserver only. No scroll listener.
       ----------------------------------------------------------------- */
    var revealTargets = document.querySelectorAll('[data-reveal]');

    if (reduced || !('IntersectionObserver' in window)) {
        for (var i = 0; i < revealTargets.length; i++) {
            revealTargets[i].setAttribute('data-shown', '');
        }
    } else {
        var revealObserver = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (!entry.isIntersecting) return;
                entry.target.setAttribute('data-shown', '');
                revealObserver.unobserve(entry.target);
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -8% 0px' });

        for (var j = 0; j < revealTargets.length; j++) {
            revealObserver.observe(revealTargets[j]);
        }
    }

    /* -----------------------------------------------------------------
       Nav hairline. A sentinel at the top of the document, observed,
       instead of a scroll handler.
       ----------------------------------------------------------------- */
    var nav = document.getElementById('nav');
    var sentinel = document.getElementById('top-sentinel');

    if ('IntersectionObserver' in window && sentinel) {
        new IntersectionObserver(function (entries) {
            nav.setAttribute('data-stuck', entries[0].isIntersecting ? 'false' : 'true');
        }, { threshold: 0 }).observe(sentinel);
    }

    /* -----------------------------------------------------------------
       Section index: mark which offering the reader is in.
       ----------------------------------------------------------------- */
    var indexLinks = Array.prototype.slice.call(document.querySelectorAll('.index-link'));
    var watched = indexLinks
        .map(function (link) { return document.getElementById(link.getAttribute('data-index-for')); })
        .filter(Boolean);

    if ('IntersectionObserver' in window && watched.length) {
        var visible = {};
        var sectionObserver = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                visible[entry.target.id] = entry.isIntersecting ? entry.intersectionRatio : 0;
            });
            var best = null;
            var bestRatio = 0;
            Object.keys(visible).forEach(function (id) {
                if (visible[id] > bestRatio) { bestRatio = visible[id]; best = id; }
            });
            indexLinks.forEach(function (link) {
                var on = best !== null && link.getAttribute('data-index-for') === best;
                link.setAttribute('aria-current', on ? 'true' : 'false');
            });
        }, { threshold: [0, 0.15, 0.4, 0.7], rootMargin: '-140px 0px -35% 0px' });

        watched.forEach(function (section) { sectionObserver.observe(section); });
    }

    /* -----------------------------------------------------------------
       Translations. The shared JSON files stay the single source of text.
       ----------------------------------------------------------------- */
    var cache = {};

    function loadTranslations(lang) {
        if (cache[lang]) return Promise.resolve(cache[lang]);
        return fetch('../../translations/' + lang + '.json')
            .then(function (r) { return r.json(); })
            .then(function (json) { cache[lang] = json; return json; })
            .catch(function (err) {
                console.error('Error loading translations for ' + lang + ':', err);
                return {};
            });
    }

    function applyTranslations(t) {
        var nodes = document.querySelectorAll('[data-i18n]');
        for (var k = 0; k < nodes.length; k++) {
            var key = nodes[k].getAttribute('data-i18n');
            if (t[key]) nodes[k].textContent = t[key];
        }
    }

    var langButtons = Array.prototype.slice.call(document.querySelectorAll('.lang-btn'));

    langButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
            langButtons.forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
            btn.setAttribute('aria-pressed', 'true');

            var lang = btn.getAttribute('data-lang');
            document.documentElement.lang = lang;
            loadTranslations(lang).then(applyTranslations);
        });
    });

    loadTranslations('de').then(applyTranslations);
})();
</script>
